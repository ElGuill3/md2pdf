name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Report ShellCheck version
        run: shellcheck --version

      - name: Run static checks
        run: ./tests/lint.sh

      - name: Run documentation checks
        run: ./tests/docs.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Pandoc 3.8
        uses: pandoc/actions/setup@v1
        with:
          version: '3.8'

      - name: Install Typst 0.15.0
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0

      - name: Install Ubuntu PDF and font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-core fonts-noto-cjk fonts-noto-mono

      - name: Install macOS PDF and font dependencies
        if: runner.os == 'macOS'
        run: |
          brew install poppler
          brew install --cask font-noto-sans font-noto-serif font-noto-serif-cjk-sc font-noto-naskh-arabic font-noto-serif-hebrew font-noto-sans-mono

      - name: Verify shell syntax with the platform sh
        run: |
          for script in md2pdf install.sh uninstall.sh install-skill.sh tests/*.sh tests/fixtures/bsd-stat tests/fixtures/mock-curl tests/fixtures/typst-proxy; do
            sh -n "$script"
          done

      - name: Run real PDF suite
        run: ./tests/run.sh

      - name: Run skill installer suite
        run: ./tests/skill-installer.sh
