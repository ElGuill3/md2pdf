schema: spec-driven

context: |
  Project: md2pdf, a POSIX sh CLI that converts Pandoc Markdown to styled PDFs.
  Stack: POSIX sh launcher and installers, Pandoc 3.8, Typst 0.15, Lua filters, and Typst profiles.
  Architecture: the launcher validates input and metadata, stages trusted runtime data, invokes Pandoc and Typst, then publishes atomically.
  Testing: shell-driven real PDF integration and installer acceptance suites run in GitHub Actions on Ubuntu and macOS.
  Style: preserve existing POSIX shell conventions, deterministic diagnostics, temporary artifacts, and English technical artifacts.
  Workflow: automatic execution, hybrid OpenSpec plus Engram persistence, automatic review chaining, and an 800-line review budget.

strict_tdd: true

sdd:
  execution_mode: auto
  artifact_store:
    mode: hybrid
  delivery_strategy: auto-chain
  review_budget_lines: 800

testing:
  strict_tdd: true
  test_runner:
    command: "./tests/run.sh"
    framework: "POSIX shell integration harness"
  commands:
    - "./tests/run.sh"
    - "./tests/skill-installer.sh"
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: true
      tool: "tests/run.sh with Pandoc, Typst, and Poppler"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: false
      command: null
    type_checker:
      available: false
      command: null
    formatter:
      available: false
      command: null
    static_validation:
      available: true
      command: "sh -n md2pdf install.sh uninstall.sh install-skill.sh tests/run.sh tests/skill-installer.sh"
    whitespace_validation:
      available: true
      command: "git diff --check"

rules:
  proposal:
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords such as MUST, SHALL, SHOULD, and MAY.
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale.
  tasks:
    - Group tasks by phase with hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    guidelines:
      - Follow existing POSIX shell, Lua filter, and Typst profile patterns.
      - Keep source-relative resources confined and preserve atomic publication behavior.
    tdd: true
    test_command: "./tests/run.sh && ./tests/skill-installer.sh"
  verify:
    test_command: "./tests/run.sh && ./tests/skill-installer.sh"
    build_command: "sh -n md2pdf install.sh uninstall.sh install-skill.sh tests/run.sh tests/skill-installer.sh"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
